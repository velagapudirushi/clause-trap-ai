[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clause-trap-ai"
version = "0.1.0"
description = "Fine-Tuned Hugging Face + PyTorch LoRA Contract & Terms-of-Service Red-Flag Detector with Deterministic Quote Verification."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rushi Velagapudi", email = "velagapudirushi@users.noreply.github.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pandera>=0.20.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "streamlit>=1.45.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
